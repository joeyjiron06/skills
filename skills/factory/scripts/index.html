<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Factory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
    />
    <style>
      /* Geist, dark only. Same system as the light spec, with the ladder inverted:
         a near-black canvas, near-white ink, a hairline grey border, and color
         reserved for status signals and the header's mesh bloom. */
      :root {
        color-scheme: dark;

        --canvas: #0a0a0a;
        --canvas-elevated: #111111;
        --hairline-soft: #1a1a1a;
        --hairline: #262626;
        --hairline-strong: #333333;

        --ink: #ededed;
        --body: #a1a1a1;
        --mute: #8f8f8f;
        --faint: #6b6b6b;

        --link: #3291ff;
        --link-deep: #0070f3;
        --link-soft: rgba(50, 145, 255, 0.14);
        --error: #ff4f4f;
        --error-soft: rgba(255, 79, 79, 0.13);
        --warning: #f5a623;
        --warning-soft: rgba(245, 166, 35, 0.13);

        --violet: #7928ca;
        --cyan: #50e3c2;
        --pink: #ff0080;

        --sans: "Geist", Inter, Arial, system-ui, sans-serif;
        --mono: "Geist Mono", "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;

        --rounded-sm: 6px;
        --rounded-md: 12px;
        --rounded-lg: 16px;
        --rounded-full: 9999px;

        --shadow-whisper: 0 1px 1px rgba(0, 0, 0, 0.4);
        --shadow-float: 0 2px 2px rgba(0, 0, 0, 0.3), 0 8px 16px -4px rgba(0, 0, 0, 0.5),
          inset 0 0 0 1px var(--hairline);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 400 14px/20px var(--sans);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      button { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

      .eyebrow {
        font: 500 12px/16px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0;
        color: var(--mute);
      }
      .mono { font-family: var(--mono); }

      /* --- Header: the only decorative surface ---------------------------------- */
      header {
        position: relative;
        overflow: hidden;
        border-bottom: 1px solid var(--hairline);
        padding: 32px 24px 24px;
        flex-shrink: 0;
      }
      header::before {
        content: "";
        position: absolute;
        inset: -120px -10% auto auto;
        width: 720px;
        height: 320px;
        background:
          radial-gradient(closest-side at 20% 60%, rgba(0, 124, 240, 0.35), transparent),
          radial-gradient(closest-side at 45% 40%, rgba(0, 223, 216, 0.22), transparent),
          radial-gradient(closest-side at 65% 55%, rgba(121, 40, 202, 0.35), transparent),
          radial-gradient(closest-side at 82% 45%, rgba(255, 0, 128, 0.25), transparent),
          radial-gradient(closest-side at 95% 70%, rgba(249, 203, 40, 0.18), transparent);
        filter: blur(40px);
        pointer-events: none;
      }
      .header-row {
        position: relative;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }
      h1 {
        margin: 4px 0 0;
        font: 600 32px/40px var(--sans);
        letter-spacing: -1.28px;
      }
      .summary { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .connection {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-full);
        background: rgba(17, 17, 17, 0.7);
        color: var(--body);
        font: 500 12px/16px var(--mono);
        text-transform: uppercase;
      }
      .connection .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
      .connection[data-state="live"] .dot { background: var(--link); box-shadow: 0 0 0 3px var(--link-soft); }
      .connection[data-state="down"] .dot { background: var(--error); }

      /* --- Board --------------------------------------------------------------- */
      main {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(208px, 1fr);
        gap: 12px;
        padding: 16px 24px 24px;
        overflow-x: auto;
      }
      .column {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--hairline-soft);
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-md);
      }
      .column-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--hairline);
      }
      .count {
        min-width: 22px;
        height: 20px;
        padding: 0 6px;
        border-radius: var(--rounded-full);
        border: 1px solid var(--hairline-strong);
        color: var(--body);
        font: 500 12px/18px var(--mono);
        text-align: center;
      }
      .cards {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .empty {
        padding: 24px 8px;
        text-align: center;
        color: var(--faint);
        font-size: 12px;
      }

      .card {
        background: var(--canvas-elevated);
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-md);
        box-shadow: var(--shadow-whisper);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        transition: border-color 0.6s ease;
      }
      .card.flash { border-color: var(--link); transition: none; }
      .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .card-id { font: 500 12px/16px var(--mono); color: var(--mute); }
      .card-time { font-size: 12px; color: var(--faint); }
      .card-title {
        margin: 0;
        font: 500 14px/20px var(--sans);
        letter-spacing: -0.28px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .progress { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; }
      .progress span { height: 3px; border-radius: 2px; background: var(--hairline-strong); }
      .progress span.on { background: var(--body); }
      .progress span.current { background: var(--ink); }
      .progress[data-tone="warning"] span.current { background: var(--warning); }
      .progress[data-tone="error"] span.current { background: var(--error); }
      .progress[data-tone="success"] span.current { background: var(--link); }
      .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .branch {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 400 12px/16px var(--mono);
        color: var(--faint);
      }

      /* --- Badges & buttons ------------------------------------------------------ */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 20px;
        padding: 0 8px;
        border-radius: var(--rounded-full);
        border: 1px solid var(--hairline-strong);
        color: var(--body);
        font: 500 12px/16px var(--sans);
        white-space: nowrap;
      }
      .badge.mono { font-family: var(--mono); }
      .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .badge[data-tone="running"] { color: var(--ink); }
      .badge[data-tone="running"] .dot { animation: pulse 1.4s ease-in-out infinite; }
      .badge[data-tone="success"] { color: var(--link); border-color: transparent; background: var(--link-soft); }
      .badge[data-tone="warning"] { color: var(--warning); border-color: transparent; background: var(--warning-soft); }
      .badge[data-tone="error"] { color: var(--error); border-color: transparent; background: var(--error-soft); }
      .badge[data-tone="idle"] { color: var(--mute); }
      @keyframes pulse { 50% { opacity: 0.25; } }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 10px;
        border-radius: var(--rounded-sm);
        border: 1px solid var(--hairline-strong);
        background: var(--canvas-elevated);
        color: var(--ink);
        font: 500 13px/20px var(--sans);
        cursor: pointer;
        flex-shrink: 0;
      }
      .btn:hover { background: var(--hairline-soft); border-color: #444; }
      .btn:active { background: var(--hairline); }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: var(--rounded-full);
        border: 1px solid var(--hairline-strong);
        background: var(--canvas-elevated);
        color: var(--body);
        cursor: pointer;
        flex-shrink: 0;
      }
      .icon-btn:hover { color: var(--ink); background: var(--hairline-soft); }

      /* --- Details panel ---------------------------------------------------------- */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 10;
      }
      .panel {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(640px, 100vw);
        background: var(--canvas);
        border-left: 1px solid var(--hairline);
        box-shadow: var(--shadow-float);
        transform: translateX(100%);
        transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1), visibility 0s linear 0.28s;
        visibility: hidden;
        z-index: 11;
        display: flex;
        flex-direction: column;
      }
      body.panel-open .backdrop { opacity: 1; pointer-events: auto; }
      body.panel-open .panel {
        transform: none;
        visibility: visible;
        transition: transform 0.28s cubic-bezier(0.32, 0.72, 0, 1);
      }
      .panel-head {
        display: flex;
        gap: 16px;
        align-items: flex-start;
        justify-content: space-between;
        padding: 24px 24px 20px;
        border-bottom: 1px solid var(--hairline);
      }
      .panel-head h2 {
        margin: 6px 0 10px;
        font: 600 20px/28px var(--sans);
        letter-spacing: -0.4px;
        overflow-wrap: anywhere;
      }
      .panel-body { flex: 1; overflow-y: auto; padding: 24px; }
      .section { margin-bottom: 32px; }
      .section > .eyebrow { display: block; margin-bottom: 12px; }

      .meta {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-md);
        overflow: hidden;
      }
      .meta > div {
        padding: 12px 16px;
        border-bottom: 1px solid var(--hairline);
        min-width: 0;
      }
      .meta > div:nth-child(odd) { border-right: 1px solid var(--hairline); }
      .meta > div.wide { grid-column: 1 / -1; border-right: 0; }
      .meta > div:nth-last-child(-n + 1) { border-bottom: 0; }
      .meta .label { font-size: 12px; color: var(--mute); margin-bottom: 2px; }
      .meta .value { color: var(--ink); overflow-wrap: anywhere; }
      .meta .value.mono { font-size: 13px; }

      .steps { display: flex; flex-direction: column; gap: 8px; }
      .step {
        background: var(--canvas-elevated);
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-md);
        padding: 14px 16px;
      }
      .step.missing { background: transparent; border-style: dashed; }
      .step-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .step-name { font: 500 14px/20px var(--sans); letter-spacing: -0.28px; }
      .step-time { font-size: 12px; color: var(--faint); margin-top: 2px; }
      .fields {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 6px 16px;
        margin: 12px 0 0;
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
      }
      .fields dt { font: 500 12px/20px var(--mono); color: var(--mute); text-transform: uppercase; }
      .fields dd { margin: 0; color: var(--body); overflow-wrap: anywhere; display: flex; flex-wrap: wrap; gap: 6px; }
      .error-text { margin: 12px 0 0; color: var(--error); font: 400 12px/16px var(--mono); }

      .tabs {
        display: inline-flex;
        gap: 2px;
        padding: 3px;
        margin-bottom: 12px;
        border: 1px solid var(--hairline);
        border-radius: var(--rounded-sm);
        background: var(--canvas-elevated);
      }
      .tab {
        height: 28px;
        padding: 0 12px;
        border: 0;
        border-radius: 4px;
        background: transparent;
        color: var(--body);
        font: 500 13px/20px var(--sans);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .tab:hover { color: var(--ink); }
      .tab[aria-selected="true"] { background: var(--hairline); color: var(--ink); }
      .tab .tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
      .tab .tab-dot[data-tone="success"] { background: var(--link); }
      .tab .tab-dot[data-tone="warning"] { background: var(--warning); }
      .tab .tab-dot[data-tone="error"] { background: var(--error); }
      .tab .tab-dot[data-tone="running"] { background: var(--ink); animation: pulse 1.4s ease-in-out infinite; }
      .subhead { margin: 16px 0 8px; }
      .note { color: var(--faint); font-size: 13px; }

      @media (max-width: 640px) {
        header { padding: 24px 16px 16px; }
        main { padding: 12px 16px 16px; grid-auto-columns: minmax(260px, 85vw); }
        .panel-head, .panel-body { padding-left: 16px; padding-right: 16px; }
        .meta { grid-template-columns: 1fr; }
        .meta > div:nth-child(odd) { border-right: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .panel, body.panel-open .panel, .backdrop { transition: none; }
        .badge .dot, .tab .tab-dot { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-row">
        <div>
          <span class="eyebrow">Software factory</span>
          <h1>Jobs</h1>
        </div>
        <div class="summary">
          <span class="badge mono" id="total">0 jobs</span>
          <span class="connection" id="connection" data-state="connecting"><span class="dot"></span><span>Connecting</span></span>
        </div>
      </div>
    </header>

    <main id="board" aria-label="Job board"></main>

    <div class="backdrop" id="backdrop"></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true" inert>
      <div class="panel-head" id="panel-head"></div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <script type="module">
      /** @typedef {import("./server.js").Job} Job */
      /** @typedef {import("./server.js").Round} Round */

      const COLUMNS = [
        ["new", "New"],
        ["intake", "Intake"],
        ["spec", "Spec"],
        ["build", "Build"],
        ["gate", "Gate"],
        ["review", "Review"],
        ["approve", "Approve"],
        ["done", "Done"],
      ];
      const COLUMN_INDEX = Object.fromEntries(COLUMNS.map(([key], i) => [key, i]));
      const REVIEWERS = ["code", "security", "ui", "ux"];
      const REVIEWER_LABELS = { code: "Code", security: "Security", ui: "UI", ux: "UX" };
      // Shown in a step card's header (badge, timing), so left out of its field list.
      const HIDDEN_FIELDS = new Set(["STATUS", "STARTED", "FINISHED", "OUTCOME", "ROUND", "REVIEWER"]);

      /** @type {Map<string, Job>} */
      const jobs = new Map();
      /** @type {string | null} */
      let openId = null;
      // null follows the latest round as new rounds arrive.
      /** @type {number | null} */
      let openRound = null;

      const board = document.getElementById("board");
      const panel = document.getElementById("panel");
      const panelHead = document.getElementById("panel-head");
      const panelBody = document.getElementById("panel-body");

      // --- Stream --------------------------------------------------------------------

      const connection = document.getElementById("connection");
      function setConnection(state, label) {
        connection.dataset.state = state;
        connection.lastElementChild.textContent = label;
      }

      function connect() {
        const stream = new EventSource("/jobs");
        stream.onopen = () => setConnection("live", "Live");
        stream.onerror = () => setConnection("down", "Reconnecting");
        // Sent on every (re)connect: the whole truth, so replace everything.
        stream.addEventListener("jobs", (event) => {
          jobs.clear();
          for (const job of JSON.parse(event.data)) jobs.set(job.id, job);
          render();
          const linked = location.hash.match(/^#job=(\d{3})$/)?.[1];
          if (linked && !openId && jobs.has(linked)) openPanel(linked, null);
        });
        stream.addEventListener("job", (event) => {
          const job = JSON.parse(event.data);
          jobs.set(job.id, job);
          render();
          flash(job.id);
        });
        stream.addEventListener("job-removed", (event) => {
          const { id } = JSON.parse(event.data);
          jobs.delete(id);
          if (openId === id) closePanel();
          render();
        });
      }

      // --- Job state ----------------------------------------------------------------

      const isError = (state) => Boolean(state && "ERROR" in state);

      // The tone and label of one step file's state.
      function describe(state) {
        if (!state || !Object.keys(state).length) return { tone: "idle", label: "Not started" };
        if (isError(state)) return { tone: "error", label: "Unreadable" };
        if (state.STATUS === "RUNNING") return { tone: "running", label: state.FEEDBACK ? "Running · feedback" : "Running" };
        const outcome = state.OUTCOME;
        if (!outcome) return { tone: "success", label: "Complete" };
        if (["BLOCKED", "CHANGES", "APPROVAL-NEEDS-HUMAN"].includes(outcome)) return { tone: "warning", label: titleCase(outcome) };
        if (["REJECT", "FAIL"].includes(outcome)) return { tone: "error", label: outcome === "REJECT" ? "Rejected" : "Failed" };
        return { tone: "success", label: titleCase(outcome) };
      }

      // All of a round's reviews as one state: running if any are, else the worst outcome.
      function reviewsState(reviews) {
        const states = Object.values(reviews);
        const bad = states.find(isError);
        if (bad) return bad;
        if (states.some((s) => s.STATUS === "RUNNING")) return { STATUS: "RUNNING" };
        if (states.some((s) => s.OUTCOME === "CHANGES")) return { STATUS: "COMPLETE", OUTCOME: "CHANGES" };
        return { STATUS: "COMPLETE", OUTCOME: "PASS" };
      }

      /**
       * The column a job sits in: the furthest stage it has reached, with that
       * stage's state for the card's badge.
       * @param {Job} job
       */
      function placement(job) {
        const { info, steps, rounds } = job;
        const round = rounds.at(-1);
        const decision = steps.decision;
        if (info.FINISHED || decision?.STATUS === "COMPLETE") {
          return { column: "done", state: decision ?? { STATUS: "COMPLETE" } };
        }
        if (steps.intake?.STATUS === "COMPLETE" && steps.intake.OUTCOME === "REJECT") {
          return { column: "done", state: steps.intake };
        }
        if (decision) return { column: "approve", state: decision };
        if (round) {
          if (Object.keys(round.reviews).length) return { column: "review", state: reviewsState(round.reviews) };
          // The builder runs the gate while it works: it's the gate's turn once the build is done.
          if (round.build?.STATUS === "COMPLETE" && round.build.OUTCOME !== "BLOCKED") {
            return { column: "gate", state: round.gate ?? {} };
          }
          return { column: "build", state: round.build ?? {} };
        }
        if (steps.spec) return { column: "spec", state: steps.spec };
        if (steps.intake) return { column: "intake", state: steps.intake };
        return { column: "new", state: {} };
      }

      // --- Board -----------------------------------------------------------------

      function render() {
        const byColumn = Object.fromEntries(COLUMNS.map(([key]) => [key, []]));
        for (const job of jobs.values()) byColumn[placement(job).column].push(job);

        board.innerHTML = COLUMNS.map(([key, label]) => {
          const list = byColumn[key].sort((a, b) => b.id.localeCompare(a.id));
          return `
            <section class="column" aria-label="${label}">
              <div class="column-head">
                <span class="eyebrow">${label}</span>
                <span class="count">${list.length}</span>
              </div>
              <div class="cards">
                ${list.length ? list.map(card).join("") : `<div class="empty">No jobs</div>`}
              </div>
            </section>`;
        }).join("");

        document.getElementById("total").textContent = `${jobs.size} job${jobs.size === 1 ? "" : "s"}`;
        if (openId) renderPanel();
      }

      /** @param {Job} job */
      function card(job) {
        const { info, steps, rounds } = job;
        const { column, state } = placement(job);
        const { tone, label } = column === "new" ? { tone: "idle", label: "Queued" } : describe(state);
        const current = COLUMN_INDEX[column];
        const progress = COLUMNS.map((_, i) =>
          `<span class="${i === current ? "current" : i < current ? "on" : ""}"></span>`
        ).join("");
        const tags = [badge(tone, label)];
        if (rounds.length) tags.push(`<span class="badge mono">R${rounds.at(-1).round}</span>`);
        if (steps.intake?.RISK) tags.push(`<span class="badge">${esc(steps.intake.RISK)} risk</span>`);

        return `
          <article class="card" data-id="${esc(job.id)}">
            <div class="card-top">
              <span class="card-id">#${esc(job.id)}</span>
              <span class="card-time" title="${esc(info.STARTED ?? "")}">${relative(info.STARTED)}</span>
            </div>
            <h3 class="card-title">${esc(info.TITLE ?? (isError(info) ? "Unreadable job.md" : "Untitled job"))}</h3>
            <div class="tags">${tags.join("")}</div>
            <div class="progress" data-tone="${tone}" aria-hidden="true">${progress}</div>
            <div class="card-foot">
              <span class="branch" title="${esc(info.BRANCH ?? "")}">${esc(info.BRANCH ?? "")}</span>
              <button class="btn" data-open="${esc(job.id)}">Details</button>
            </div>
          </article>`;
      }

      function flash(id) {
        const el = board.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
        if (!el) return;
        el.classList.add("flash");
        requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove("flash")));
      }

      board.addEventListener("click", (event) => {
        const button = event.target.closest("[data-open]");
        if (button) openPanel(button.dataset.open, button);
      });

      // --- Panel ------------------------------------------------------------------

      /** @type {HTMLElement | null} */
      let returnFocus = null;

      function openPanel(id, trigger) {
        openId = id;
        openRound = null;
        returnFocus = trigger;
        history.replaceState(null, "", `#job=${id}`);
        renderPanel();
        panelBody.scrollTop = 0;
        document.body.classList.add("panel-open");
        panel.inert = false;
        panel.setAttribute("aria-hidden", "false");
        panel.querySelector("[data-close]").focus();
      }

      function closePanel() {
        openId = null;
        history.replaceState(null, "", location.pathname);
        document.body.classList.remove("panel-open");
        panel.inert = true;
        panel.setAttribute("aria-hidden", "true");
        returnFocus?.focus();
      }

      document.getElementById("backdrop").addEventListener("click", closePanel);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && openId) closePanel();
      });
      panel.addEventListener("click", (event) => {
        if (event.target.closest("[data-close]")) return closePanel();
        const tab = event.target.closest("[data-round]");
        if (!tab) return;
        const round = Number(tab.dataset.round);
        const latest = jobs.get(openId)?.rounds.at(-1)?.round;
        openRound = round === latest ? null : round;
        renderPanel();
        panel.querySelector(`[data-round="${round}"]`)?.focus();
      });

      function renderPanel() {
        const job = jobs.get(openId);
        if (!job) return closePanel();
        // Live updates rebuild the panel: put focus back where it was.
        const focused = panel.contains(document.activeElement) ? document.activeElement : null;
        const refocus = focused?.dataset.round ? `[data-round="${focused.dataset.round}"]` : focused?.hasAttribute("data-close") ? "[data-close]" : null;
        renderPanelContent(job);
        if (refocus) panel.querySelector(refocus)?.focus();
      }

      /** @param {Job} job */
      function renderPanelContent(job) {
        const { info, steps, rounds } = job;
        const { column, state } = placement(job);
        const status = column === "new" ? { tone: "idle", label: "Queued" } : describe(state);
        const columnLabel = COLUMNS[COLUMN_INDEX[column]][1];

        panelHead.innerHTML = `
          <div style="min-width:0">
            <span class="eyebrow">Job #${esc(job.id)}</span>
            <h2 id="panel-title">${esc(info.TITLE ?? "Untitled job")}</h2>
            <div class="tags">
              <span class="badge mono">${columnLabel}</span>
              ${badge(status.tone, status.label)}
              ${rounds.length ? `<span class="badge mono">${rounds.length} round${rounds.length === 1 ? "" : "s"}</span>` : ""}
            </div>
          </div>
          <button class="icon-btn" data-close aria-label="Close details">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l10 10M13 3L3 13"/></svg>
          </button>`;

        panelBody.innerHTML = `
          <section class="section">
            <span class="eyebrow">Overview</span>
            ${overview(job)}
          </section>
          <section class="section">
            <span class="eyebrow">Pipeline</span>
            <div class="steps">
              ${step("Intake", steps.intake)}
              ${step("Spec", steps.spec)}
              ${step("Approve", steps.decision)}
              ${steps.pr ? step("Pull request", steps.pr) : ""}
              ${extraSteps(steps)}
            </div>
          </section>
          <section class="section">
            <span class="eyebrow">Rounds</span>
            ${roundsSection(job)}
          </section>`;
      }

      /** @param {Job} job */
      function overview({ info }) {
        if (isError(info)) return `<p class="error-text">${esc(info.ERROR)}</p>`;
        const cells = [
          ["Started", time(info.STARTED)],
          [info.FINISHED ? "Finished" : "Elapsed", info.FINISHED ? time(info.FINISHED) : esc(duration(info.STARTED))],
          ["Branch", `<span class="mono">${esc(info.BRANCH ?? "—")}</span>`, true],
          ["Worktree", `<span class="mono">${esc(info.WORKTREE ?? "—")}</span>`, true],
        ];
        return `<div class="meta">${cells.map(([label, value, wide]) =>
          `<div class="${wide ? "wide" : ""}"><div class="label">${label}</div><div class="value">${value}</div></div>`
        ).join("")}</div>`;
      }

      // Any other <name>.md in the job folder.
      function extraSteps(steps) {
        const known = new Set(["intake", "spec", "decision", "pr"]);
        return Object.entries(steps)
          .filter(([name]) => !known.has(name))
          .map(([name, state]) => step(`${name}.md`, state))
          .join("");
      }

      /** @param {Job} job */
      function roundsSection({ rounds, steps }) {
        if (!rounds.length) return `<p class="note">No build rounds yet.</p>`;
        const latest = rounds.at(-1).round;
        const selected = rounds.find((r) => r.round === (openRound ?? latest)) ?? rounds.at(-1);

        const tabs = rounds.map((r) => {
          const { tone } = roundTone(r);
          const current = r.round === selected.round;
          return `<button class="tab" role="tab" data-round="${r.round}" aria-selected="${current}" tabindex="${current ? 0 : -1}">
            <span class="tab-dot" data-tone="${tone}"></span>Round ${r.round}${r.round === latest ? ` <span class="note">· latest</span>` : ""}
          </button>`;
        }).join("");

        // Reviewers the intake asked for, plus any review file that exists.
        const surfaces = (steps.intake?.SURFACES ?? "").split(",").map((s) => s.trim());
        const reviewers = REVIEWERS.filter((name) =>
          name === "code" || surfaces.includes(name) || name in selected.reviews
        );
        for (const name of Object.keys(selected.reviews)) if (!reviewers.includes(name)) reviewers.push(name);

        return `
          <div class="tabs" role="tablist" aria-label="Rounds">${tabs}</div>
          <div class="steps">
            ${step("Build", selected.build)}
            ${step("Gate", selected.gate)}
          </div>
          <div class="eyebrow subhead">Reviews</div>
          <div class="steps">
            ${reviewers.map((name) => step(`${REVIEWER_LABELS[name] ?? titleCase(name)} review`, selected.reviews[name])).join("")}
          </div>`;
      }

      /** @param {Round} round */
      function roundTone(round) {
        if (Object.keys(round.reviews).length) return describe(reviewsState(round.reviews));
        if (round.build?.STATUS === "COMPLETE" && round.build.OUTCOME !== "BLOCKED" && round.gate) return describe(round.gate);
        return describe(round.build);
      }

      function step(name, state) {
        const { tone, label } = describe(state);
        const missing = tone === "idle";
        let detail = "";
        if (isError(state)) {
          detail = `<p class="error-text">${esc(state.ERROR)}</p>`;
        } else if (!missing) {
          const fields = Object.entries(state).filter(([key]) => !HIDDEN_FIELDS.has(key));
          if (fields.length) {
            detail = `<dl class="fields">${fields.map(([key, value]) =>
              `<dt>${esc(key)}</dt><dd>${fieldValue(key, value)}</dd>`
            ).join("")}</dl>`;
          }
        }
        const timing = missing || isError(state)
          ? ""
          : state.FINISHED
            ? `Finished ${relative(state.FINISHED)} · took ${duration(state.STARTED, state.FINISHED)}`
            : state.STARTED ? `Started ${relative(state.STARTED)} · ${duration(state.STARTED)} so far` : "";
        return `
          <div class="step${missing ? " missing" : ""}">
            <div class="step-head">
              <div>
                <div class="step-name">${esc(name)}</div>
                ${timing ? `<div class="step-time">${timing}</div>` : ""}
              </div>
              ${badge(tone, label)}
            </div>
            ${detail}
          </div>`;
      }

      function fieldValue(key, value) {
        if (key === "SURFACES") {
          return value.split(",").map((s) => s.trim()).filter(Boolean)
            .map((s) => `<span class="badge">${esc(s)}</span>`).join("");
        }
        if (key === "OUTCOME" || key === "CHECKS" || key === "DECISION") {
          const { tone } = describe({ STATUS: "COMPLETE", OUTCOME: value });
          return badge(tone, value, false);
        }
        return `<span class="mono">${esc(value)}</span>`;
      }

      // --- Formatting --------------------------------------------------------------

      function badge(tone, label, dot = true) {
        return `<span class="badge" data-tone="${tone}">${dot ? `<span class="dot"></span>` : ""}${esc(label)}</span>`;
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      }

      function titleCase(text) {
        return text.toLowerCase().split(/[-_ ]/).map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
      }

      function relative(iso) {
        const ms = Date.parse(iso);
        if (Number.isNaN(ms)) return "";
        const seconds = Math.round((Date.now() - ms) / 1000);
        if (seconds < 45) return "just now";
        return `${compact(seconds)} ago`;
      }

      function duration(startIso, endIso) {
        const start = Date.parse(startIso);
        if (Number.isNaN(start)) return "—";
        const end = endIso ? Date.parse(endIso) : Date.now();
        return compact(Math.max(0, Math.round((end - start) / 1000)));
      }

      function compact(seconds) {
        if (seconds < 60) return `${seconds}s`;
        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) return `${minutes}m`;
        const hours = Math.floor(minutes / 60);
        if (hours < 24) return `${hours}h ${minutes % 60}m`;
        return `${Math.floor(hours / 24)}d ${hours % 24}h`;
      }

      function time(iso) {
        const ms = Date.parse(iso);
        if (Number.isNaN(ms)) return "—";
        const date = new Date(ms).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
        return `${esc(date)} <span class="note">· ${relative(iso)}</span>`;
      }

      // Keep relative times fresh without waiting for an event.
      setInterval(() => jobs.size && render(), 30_000);

      render();
      connect();
    </script>
  </body>
</html>
